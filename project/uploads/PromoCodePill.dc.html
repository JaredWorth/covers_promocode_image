<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/covers-design-system-cdd9ea05-c617-4c16-b6ae-35a069d36b0e/tokens/fonts.css">
<style>body{margin:0}</style>
</helmet>
<div style="display:inline-flex;flex-direction:column;align-items:center;gap:22px">
<div style="display:{{ labelDisplay }};font-family:'Aeonik Fono',monospace;font-size:34px;letter-spacing:.14em;color:#e9d9a0;text-transform:uppercase">{{ label }}</div>
<div style="background:#f4e3a1;border:10px solid #fff;border-radius:999px;padding:26px 64px;white-space:nowrap;box-shadow:0 0 0 14px rgba(244,227,161,.25),0 20px 60px rgba(0,0,0,.6)">
<div style="font-family:'Aeonik Fono',monospace;font-weight:700;font-size:112px;line-height:1;color:#0c0a06;letter-spacing:.01em">{{ code }}</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:300},&quot;code&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;COVERS1550&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Use promo code&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const label = this.props.label ?? 'Use promo code';
    return { label, code: this.props.code ?? 'COVERS1550', labelDisplay: label ? 'block' : 'none' };
  }
}
</script>
</body>
</html>
